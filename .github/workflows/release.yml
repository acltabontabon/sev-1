name: Release game

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import sys; sys.path.insert(0, "tools"); from package_ci import release_notes; import os; print(release_notes(os.environ["RELEASE_TAG"]))'
      - name: Install pinned Godot and export templates
        run: python tools/install_ci_godot.py
      - name: Bootstrap clean asset imports
        run: python tools/bootstrap_ci_import.py
      - name: Validate source
        run: python tools/validate.py
      - name: Export, smoke-test and build installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: python tools/package_ci.py "$RELEASE_TAG"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            builds/ci/${{ matrix.platform }}/*.exe
            builds/ci/${{ matrix.platform }}/*.dmg
            builds/ci/${{ matrix.platform }}/*.json
            builds/ci/${{ matrix.platform }}/*.txt
            builds/ci/${{ matrix.platform }}/release-notes.md
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}
          path: logs/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes=packages/release-windows-x86_64/release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "SEV-1 $RELEASE_TAG — Friday Deployment Playtest" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" packages/release-*/*.exe packages/release-*/*.dmg packages/release-*/*.json packages/release-*/*.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file "$notes"
